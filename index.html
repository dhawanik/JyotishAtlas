exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({charts:S.charts})],{type:'application/json'}));a.download='kundlis.json';a.click()}};
function keepForm(){ui.form=ui.form||{};for(const k of['name','date','time','place','lat','lon','tz']){const e=$('#f_'+k);if(e)ui.form[k]=e.value}}
function applyForm(){for(const k in ui.form){const e=$('#f_'+k);if(e)e.value=ui.form[k]}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset,t,e);else{const cv=e.target.closest('#map');if(cv){const r=cv.getBoundingClientRect();ui.mp.ph=[90-(e.clientY-r.top)/r.height*180,(e.clientX-r.left)/r.width*360-180];drawMap(cur());$('#mphit').innerHTML=hitText(cur())}}});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.c,c=cur();if(!k){if(t.id=='vd'){view.d=t.value;render()}if(t.id=='sdt'){ui.sky=Date.parse(t.value+'T12:00:00Z')/864e5+2440587.5;render()}return}
if(k=='dv')S.cfg.dv=+t.value;else if(['ay','hs','nd'].includes(k)){S.cfg[k]=t.value;CK=''}else if(k=='act')S.act=+t.value;else if(k=='sight'){ui.sight=t.checked}else if(k=='pm')S.prov[+t.dataset.i][t.dataset.f]=t.value;
else if(k=='city'){const x=CITY[+t.value];if(x){ui.mp.ph=[x[1],x[2]]}}rr()});
if('serviceWorker'in navigator&&/^http/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!S.cur&&S.charts[0])S.cur=S.charts[0].id;render();
</script></body></html>
